*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:300 15px/1.55 'Figtree',system-ui,sans-serif;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3,.disp{font-family:'Newsreader',Georgia,serif;font-weight:500;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brass-ink)}
.mast{padding:28px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.logo{font-size:44px;line-height:1;letter-spacing:.01em}.logo em{color:var(--brass);font-weight:400}
.sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);overflow-x:auto;margin-bottom:26px}

:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.hero h2{font-size:64px;line-height:1;letter-spacing:-.01em}.hero p{color:var(--muted);margin:8px 0 0}
.sec{margin:44px 0 16px;border-bottom:1px solid var(--rule);padding-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h3{font-size:34px;font-weight:400}.sec span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.plate{height:160px;position:relative;display:flex;align-items:flex-end;padding:12px;color:#fff;overflow:hidden}
.plate::before{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.22)}
.plate img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plate.tall{height:300px}
.card.item .body h4{font-size:21px;line-height:1.15}
.plate::before{z-index:1;pointer-events:none}
.plate .cat{z-index:1}
.plate:has(img)::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5),transparent 60%)}
.plate .cat{position:relative;font-size:11px;letter-spacing:.04em;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.plate .mono{position:absolute;right:14px;top:-6px;font:italic 400 92px/1 'Newsreader',serif;opacity:.16}
.star{position:absolute;right:12px;bottom:10px;background:none;border:0;color:var(--champ);font-size:22px;cursor:pointer;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.done{position:absolute;left:14px;top:12px;width:24px;height:24px;border-radius:50%;border:1px solid var(--champ);color:var(--champ);background:rgba(0,0,0,.18);cursor:pointer;z-index:2;font-size:13px}
.done.on{background:var(--champ);color:#3a2f1c}
.body{padding:13px 15px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h4{font:500 26px/1.1 'Newsreader',serif;margin:0}
.note{color:var(--muted);font-size:13px;margin:0}
.acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:6px;font-size:13px}
.lnk{color:var(--brass-ink);text-decoration:none;border-bottom:1px solid var(--brass);padding-bottom:1px}
.mini{background:none;border:0;padding:0;color:var(--faint);cursor:pointer;font-size:12px;text-decoration:underline}
.tag{font-size:11px;color:var(--faint);margin-left:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 13px;cursor:pointer;font-size:13px;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:9px 18px;cursor:pointer;font-weight:400}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin:14px 0}
.form .wide{grid-column:1/-1}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
label.f{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.empty{border:1px dashed var(--line);border-radius:6px;padding:26px;text-align:center;color:var(--muted)}
.empty b{display:block;font:500 24px 'Newsreader',serif;color:var(--ink);margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:6px;background:var(--wash);border-radius:3px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--brass)}
.board{columns:3 190px;column-gap:12px}
.pin{break-inside:avoid;margin:0 0 12px;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pin img{display:block;width:100%}.pin div{padding:8px 11px;font-size:13px;color:var(--muted)}
.pin.pinterest{padding:14px;border-left:3px solid var(--danger)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td{padding:8px 4px;border-bottom:1px solid var(--rule)}
.tbl td:last-child{text-align:right}
.lib{display:flex;flex-wrap:wrap;gap:7px}
.q h2{font-size:34px;margin-bottom:14px}
.prose{white-space:pre-wrap;font:400 17px/1.6 'Newsreader',Georgia,serif;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:12px;padding:1px 10px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.opt{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:64px}
.opt b{font:500 22px/1.15 'Newsreader',serif}.opt span:not(.sw){color:var(--muted);font-size:13px}
.opt[aria-pressed=true]{border-color:var(--brass);background:var(--wash);box-shadow:inset 0 0 0 1px var(--brass)}
.sw{display:inline-flex;height:26px;width:112px;border-radius:2px;overflow:hidden;border:1px solid var(--line);margin-bottom:6px;vertical-align:middle}.sw i{flex:1}

.card.src .body{padding:14px 16px 15px;gap:8px}
.card.src .body h4{font-size:27px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:4px;font-size:13px;z-index:20}
details summary{cursor:pointer;color:var(--brass-ink)}
@media(max-width:520px){.hero h2{font-size:44px}.logo{font-size:34px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

input,select,textarea{border:1px solid var(--line);border-radius:6px;background:var(--bg)}

.empty{border-color:var(--line);border-radius:6px}
.prose{border:0;border-left:2px solid var(--ink);border-radius:0;background:transparent;padding:4px 0 4px 18px}

  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',rows=[['Item','Shop','Room slot','Size (in)','Cost','Client price']];let tc=0,tp=0;
  p.items.forEach(i=>{const x=S.saved.find(s=>s.id===i.sid);if(!x)return;const c=num(x.price),cp=mk(p,x);tc+=c;tp+=cp;rows.push([x.title,x.shop,i.slot,x.dims,x.price,Math.round(cp)])});
  rows.push(['Total','','','',Math.round(tc),Math.round(tp)]);
  try{await dl.save({filename:(p.name.replace(/[^\w ]+/g,'')||'Project')+' quote.csv',data:rows.map(r=>r.map(q).join(',')).join('\n')})}catch(e){}}
async function analyze(btn){
  let sm;try{sm=await claude.use('sample')}catch(e){}
  if(!sm){toast('Style analysis is not available here');return}
  const loved=Object.keys(S.loved),saved=SV().map(i=>i.title+(i.shop?' ('+i.shop+')':'')),shops=followed().map(s=>s.name);
  if(!loved.length&&!saved.length){toast('Star a few names or save an item first');return}
  btn.disabled=true;btn.textContent='Reading…';
  try{const r=await sm(`You are a ${ROLE()}. From these signals, write a warm 3-paragraph style read for a client (name the style in 2-3 words as the first line, then describe what they respond to, then give 5 specific things to look for when sourcing). Plain text, no markdown.\nLoved designers and brands: ${loved.join(', ')||'none yet'}\nSaved items: ${saved.join('; ')||'none yet'}\nShops they follow: ${shops.join(', ')||'none yet'}\nQuiz mood: ${S.quiz.mood||'n/a'}`,{cache:false});
    S.profile=r.text.trim();save()}catch(e){toast('Could not reach Claude just now')}
  render()}
(async function init(){
  render();
  let db=null,user=null;
  try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
  const h=location.hash.match(/^#board-(\w+)$/);
  if(h){shareMode='loading';render();
    try{const snap=db&&await db.doc('shared/'+h[1]).get();const raw=snap&&(snap.data?snap.data():snap);shareMode=raw&&raw.json?Object.assign(JSON.parse(raw.json),{id:h[1]}):null}catch(e){shareMode=null}
    MY={boards:{}};try{const u=await user.id();MYDOC=db.doc('feedback/'+u);const m=await MYDOC.get();if(m.exists&&m.data().json)MY=JSON.parse(m.data().json)}catch(e){MYDOC=null}
    if(!shareMode)shareMode={missing:1};render();return}
  let loaded=null;
  if(db&&user){try{const id=await user.id();dbDoc=db.collection('data/users/'+id).doc('app');const snap=await dbDoc.get();const raw=snap&&(snap.data?snap.data():snap);if(raw&&raw.json)loaded=JSON.parse(raw.json)}catch(e){}}
  if(!loaded)loaded=lsGet();
  S=Object.assign(blank(),loaded||{});applySpace();
  if(!loaded){/* first run: seed the owner's examples */
    S.saved=[{id:uid(),title:'Agra rug in Redwood, 8′ x 10′',shop:'Armadillo',price:'',url:'https://armadillo-co.com/us/shop-all/agra?color=Redwood&size=8%27+x+10%27',folder:'Rugs',img:'',ts:Date.now()},{id:uid(),title:'Gio Ponti style brass mirror',shop:'Incollect',price:'$6,670',url:'',folder:'Furniture',img:'',ts:Date.now()}];
    ['1stdibs','chairish','oblist','southlooploft','schalling'].forEach(i=>S.follows[i]=1)}
  ready=true;render();if(!loaded)save()
})();
</script>
